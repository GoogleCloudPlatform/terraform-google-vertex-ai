apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: terraform-google-vertex-ai-model-armor-floorsetting
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: Module for Model Armor Floor Settings
    source:
      repo: https://github.com/GoogleCloudPlatform/terraform-google-vertex-ai.git
      sourceType: git
      dir: /modules/model-armor-floorsetting
    version: 9.0.0
    actuationTool:
      flavor: Terraform
      version: ">= 1.3"
    description: {}
  content:
    examples:
      - name: agent-engine-developer-connect-example
        location: examples/agent-engine-developer-connect-example
      - name: agent-engine-example
        location: examples/agent-engine-example
      - name: agent-engine-nightly-example
        location: examples/agent-engine-nightly-example
      - name: feature-online-store-example
        location: examples/feature-online-store-example
      - name: model-armor-floorsetting-example
        location: examples/model-armor-floorsetting-example
      - name: model-armor-template-example
        location: examples/model-armor-template-example
      - name: semantic-governance-policy-engine-example
        location: examples/semantic-governance-policy-engine-example
      - name: semantic-governance-policy-engine-gateway-example
        location: examples/semantic-governance-policy-engine-gateway-example
      - name: semantic-governance-policy-example
        location: examples/semantic-governance-policy-example
      - name: workbench-complete-example
        location: examples/workbench-complete-example
      - name: workbench-simple-example
        location: examples/workbench-simple-example
  interfaces:
    variables:
      - name: project_id
        description: Google Cloud Project ID where the floor setting will be applied. Mutually exclusive with folder_id and org_id.
        varType: string
      - name: folder_id
        description: Numeric Folder ID where the floor setting will be applied. Mutually exclusive with project_id and org_id.
        varType: string
      - name: org_id
        description: Numeric Organization ID where the floor setting will be applied. Mutually exclusive with project_id and folder_id.
        varType: string
      - name: enable_floor_setting_enforcement
        description: Floor Settings enforcement status
        varType: bool
        defaultValue: true
      - name: malicious_uri_filter_settings
        description: Malicious URI filter enforcement status. Possible values are ENABLED or DISABLED. Set to null to omit.
        varType: string
      - name: rai_filters
        description: Confidence level for Responsible AI filters
        varType: |-
          object({
              dangerous         = optional(string)
              sexually_explicit = optional(string)
              hate_speech       = optional(string)
              harassment        = optional(string)
            })
      - name: sdp_settings
        description: Sensitive Data Protection settings. Configure either basic_config_filter_enforcement (ENABLED or DISABLED) or advanced_config.
        varType: |-
          object({
              basic_config_filter_enforcement = optional(string)
              advanced_config = optional(object({
                inspect_template    = optional(string)
                deidentify_template = optional(string)
              }))
            })
      - name: pi_and_jailbreak_filter_settings
        description: Confidence level for Prompt injection and Jailbreak Filter settings (LOW_AND_ABOVE, MEDIUM_AND_ABOVE, HIGH), or DISABLED to explicitly disable the filter.
        varType: string
      - name: ai_platform_floor_setting
        description: "Configure the AI Platform floor setting; Note: Value AI_PLATFORM must be in Integrated Services Field."
        varType: |-
          object({
              inspect_only         = optional(bool)
              inspect_and_block    = optional(bool)
              enable_cloud_logging = optional(bool)
            })
      - name: enable_multi_language_detection
        description: Enable multi-language detection for floor setting. Set to null to omit floor_setting_metadata.
        varType: bool
        defaultValue: true
      - name: integrated_services
        description: List of integrated services for which the floor setting is applicable. Possible values are AI_PLATFORM, GOOGLE_MCP_SERVER
        varType: list(string)
        defaultValue: []
      - name: google_mcp_server_floor_setting
        description: "Configure the Google MCP Server floor setting; Note: Value GOOGLE_MCP_SERVER must be in Integrated Services Field."
        varType: |-
          object({
              inspect_only         = optional(bool)
              inspect_and_block    = optional(bool)
              enable_cloud_logging = optional(bool)
            })
    outputs:
      - name: create_time
        description: Timestamp when the Model Armor floor setting was created.
      - name: floorsetting
        description: Model armor floor setting created
      - name: id
        description: An identifier for the Model Armor floor setting resource.
      - name: name
        description: The resource name of the Model Armor floor setting.
      - name: parent
        description: The parent resource path (projects/{project}, folders/{folder}, or organizations/{organizationId}).
      - name: update_time
        description: Timestamp when the Model Armor floor setting was last updated.
  requirements:
    roles:
      - level: Project
        roles:
          - roles/aiplatform.admin
          - roles/compute.admin
          - roles/compute.networkAdmin
          - roles/notebooks.admin
          - roles/iam.securityAdmin
          - roles/iam.serviceAccountAdmin
          - roles/iam.serviceAccountUser
          - roles/cloudkms.admin
          - roles/iam.roleAdmin
          - roles/storage.admin
          - roles/cloudkms.cryptoKeyEncrypterDecrypter
          - roles/modelarmor.admin
          - roles/modelarmor.floorSettingsAdmin
          - roles/agentregistry.viewer
          - roles/dns.admin
    services:
      - cloudresourcemanager.googleapis.com
      - serviceusage.googleapis.com
      - iamcredentials.googleapis.com
      - iam.googleapis.com
      - cloudbilling.googleapis.com
      - cloudkms.googleapis.com
      - servicenetworking.googleapis.com
      - secretmanager.googleapis.com
      - notebooks.googleapis.com
      - aiplatform.googleapis.com
      - iap.googleapis.com
      - modelarmor.googleapis.com
      - dlp.googleapis.com
      - agentregistry.googleapis.com
      - compute.googleapis.com
      - dns.googleapis.com
    providerVersions:
      - source: hashicorp/google
        version: ">= 7.13, < 9"
