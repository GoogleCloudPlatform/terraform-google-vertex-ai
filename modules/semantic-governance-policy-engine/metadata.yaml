apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: terraform-google-vertex-ai-semantic-governance-policy-engine
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: Vertex AI (Gemini Enterprise Agent Platform) Semantic Governance Policy Engine Module
    source:
      repo: https://github.com/GoogleCloudPlatform/terraform-google-vertex-ai.git
      sourceType: git
      dir: /modules/semantic-governance-policy-engine
    version: 7.4.0
    actuationTool:
      flavor: Terraform
      version: ">= 1.3"
    description: {}
  content:
    examples:
      - name: agent-engine-developer-connect-example
        location: examples/agent-engine-developer-connect-example
      - name: agent-engine-example
        location: examples/agent-engine-example
      - name: agent-engine-nightly-example
        location: examples/agent-engine-nightly-example
      - name: feature-online-store-example
        location: examples/feature-online-store-example
      - name: model-armor-floorsetting-example
        location: examples/model-armor-floorsetting-example
      - name: model-armor-template-example
        location: examples/model-armor-template-example
      - name: semantic-governance-policy-engine-example
        location: examples/semantic-governance-policy-engine-example
      - name: semantic-governance-policy-engine-gateway-example
        location: examples/semantic-governance-policy-engine-gateway-example
      - name: workbench-complete-example
        location: examples/workbench-complete-example
      - name: workbench-simple-example
        location: examples/workbench-simple-example
  interfaces:
    variables:
      - name: region
        description: The region of the SemanticGovernancePolicyEngine, e.g. 'us-central1'. Required by this module, even though the underlying resource treats region as optional.
        varType: string
        required: true
      - name: project_id
        description: The ID of the project in which to create the SemanticGovernancePolicyEngine.
        varType: string
        required: true
      - name: deletion_policy
        description: How Terraform treats destruction of the engine. One of DELETE (default; deprovision the engine), PREVENT (fail the destroy), or ABANDON (drop from state without deprovisioning).
        varType: string
        defaultValue: DELETE
      - name: gateway_configs
        description: Customer-VPC PSC gateway configurations, keyed by gateway name (at most 5). Each entry provisions a Private Service Connect endpoint. Within an entry, network, subnetwork, and dns_zone_name must all be set together or all omitted (a partial set is rejected); when set, network and subnetwork are full resource URIs and dns_zone_name is the private Cloud DNS zone the gateway's A-record is published into. allowed_projects (optional) enables decoupled mode and takes full 'projects/{id}' resource names.
        varType: |-
          map(object({
              network          = optional(string)
              subnetwork       = optional(string)
              dns_zone_name    = optional(string)
              allowed_projects = optional(list(string))
            }))
        defaultValue: {}
    outputs:
      - name: gateway_endpoints
        description: Map of gateway name to its full gateway object (the inputs plus the computed fields dns_record, ip_address, psc_endpoint, state).
        type:
          - map
          - - object
            - allowed_projects:
                - list
                - string
              dns_record: string
              dns_zone_name: string
              ip_address: string
              name: string
              network: string
              psc_endpoint: string
              state: string
              subnetwork: string
      - name: policy_engine
        description: The full google_vertex_ai_semantic_governance_policy_engine resource object.
        type:
          - object
          - create_time: string
            deletion_policy: string
            gateway_configs:
              - set
              - - object
                - allowed_projects:
                    - list
                    - string
                  dns_record: string
                  dns_zone_name: string
                  ip_address: string
                  name: string
                  network: string
                  psc_endpoint: string
                  state: string
                  subnetwork: string
            id: string
            ip_address: string
            name: string
            project: string
            psc_forwarding_rule: string
            psc_service_attachment: string
            region: string
            state: string
            update_time: string
  requirements:
    roles:
      - level: Project
        roles:
          - roles/aiplatform.admin
          - roles/compute.admin
          - roles/compute.networkAdmin
          - roles/notebooks.admin
          - roles/iam.securityAdmin
          - roles/iam.serviceAccountAdmin
          - roles/iam.serviceAccountUser
          - roles/cloudkms.admin
          - roles/iam.roleAdmin
          - roles/storage.admin
          - roles/cloudkms.cryptoKeyEncrypterDecrypter
          - roles/modelarmor.admin
          - roles/modelarmor.floorSettingsAdmin
    services:
      - cloudresourcemanager.googleapis.com
      - serviceusage.googleapis.com
      - iamcredentials.googleapis.com
      - iam.googleapis.com
      - cloudbilling.googleapis.com
      - cloudkms.googleapis.com
      - servicenetworking.googleapis.com
      - secretmanager.googleapis.com
      - notebooks.googleapis.com
      - aiplatform.googleapis.com
      - iap.googleapis.com
      - modelarmor.googleapis.com
      - dlp.googleapis.com
    providerVersions:
      - source: hashicorp/google
        version: ">= 8.1.0, < 9"
